<svg viewBox="0 0 100 100" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm Paper Background Gradient -->
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf9f4"/>
      <stop offset="100%" stop-color="#efece4"/>
    </linearGradient>

    <!-- Moss Green Accent Gradient -->
    <linearGradient id="moss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6b4d"/>
      <stop offset="100%" stop-color="#345037"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a1916" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#paper)" stroke="#dcd7ca" stroke-width="1"/>

  <!-- Logo Group -->
  <g filter="url(#shadow)">
    <!-- Main Black Key (Ink 900) -->
    <rect x="25" y="25" width="12" height="50" rx="4" fill="#1a1916" />
    
    <!-- Secondary Key (Moss Green) -->
    <rect x="44" y="35" width="12" height="30" rx="4" fill="url(#moss)" />
    
    <!-- Tertiary Key (Soft Ink / Gray) -->
    <rect x="63" y="45" width="12" height="10" rx="4" fill="#9c978c" />
  </g>
</svg>
