<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b18"/>
      <stop offset="50%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0d0c0a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)"/>
    </linearGradient>

    <!-- Emerald / Moss Accent Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- White Key Gradient -->
    <linearGradient id="white-key-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="key-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4"/>

  <!-- Subtle Acoustic Arch Background Element -->
  <path d="M 96 350 C 180 180, 332 180, 416 350" fill="none" stroke="rgba(52, 211, 153, 0.08)" stroke-width="14" stroke-linecap="round"/>

  <!-- Keyboard Composition -->
  <g filter="url(#key-shadow)">
    <!-- White Key 1 (Left) -->
    <rect x="124" y="148" width="76" height="236" rx="14" fill="url(#white-key-grad)"/>
    <line x1="124" y1="360" x2="200" y2="360" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

    <!-- White Key 2 (Middle) -->
    <rect x="218" y="148" width="76" height="236" rx="14" fill="url(#white-key-grad)"/>
    <line x1="218" y1="360" x2="294" y2="360" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>

    <!-- White Key 3 (Right - Emerald Active Glow) -->
    <rect x="312" y="148" width="76" height="236" rx="14" fill="url(#emerald-grad)" filter="url(#emerald-glow)"/>
    <line x1="312" y1="360" x2="388" y2="360" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

    <!-- Black Key 1 (Left-Center) -->
    <rect x="178" y="148" width="44" height="142" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <rect x="183" y="152" width="34" height="126" rx="4" fill="#09090b"/>

    <!-- Black Key 2 (Right-Center) -->
    <rect x="272" y="148" width="44" height="142" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <rect x="277" y="152" width="34" height="126" rx="4" fill="#09090b"/>
  </g>

  <!-- Dynamic Active Note Pulse Indicator -->
  <circle cx="350" cy="344" r="7" fill="#ffffff" opacity="0.95"/>
  <circle cx="350" cy="344" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
</svg>
